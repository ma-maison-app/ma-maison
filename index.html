// GLOBAL ERROR HANDLER - Catch null reference errors
// ============================================
window.addEventListener('error', function(e) {
    console.error('❌ Global error caught:', e.message, e.filename, e.lineno, e.colno);
    // Don't prevent the error from showing in console, but prevent page crash
    e.preventDefault();
    return true;
});

window.addEventListener('unhandledrejection', function(e) {
    console.error('❌ Unhandled promise rejection:', e.reason);
    e.preventDefault();
});

console.log('🏡 Ma Maison - French Sanctuary');
console.log('✅ Error handlers installed');

// Firebase REST API Implementation - Embedded directly in HTML
const FirebaseREST = {
    config: null,
    currentUser: null,
    
    init: async function(config) {
        this.config = config;
        this.currentUser = await this.getStoredUser();
        return this;
    },
    
    signUp: async function(email, password) {
        const url = `https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${this.config.apiKey}`;
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password, returnSecureToken: true })
        });
        const data = await response.json();
        if (data.error) throw new Error(data.error.message);
        
        this.currentUser = {
            uid: data.localId,
            email: data.email,
            token: data.idToken,
            refreshToken: data.refreshToken
        };
        await this.storeUser(this.currentUser);
        // Trigger auth callback
        if (window._authCallback) window._authCallback(this.currentUser);
        return this.currentUser;
    },
    
    signIn: async function(email, password) {
        const url = `https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${this.config.apiKey}`;
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password, returnSecureToken: true })
        });
        const data = await response.json();
        if (data.error) throw new Error(data.error.message);
        
        this.currentUser = {
            uid: data.localId,
            email: data.email,
            token: data.idToken,
            refreshToken: data.refreshToken
        };
        await this.storeUser(this.currentUser);
        // Trigger auth callback
        if (window._authCallback) window._authCallback(this.currentUser);
        return this.currentUser;
    },
    
    signOut: async function() {
        this.currentUser = null;
        this._memoryStore = {};
        
        // Clear IndexedDB
        try {
            const db = await this._getDB();
            const transaction = db.transaction([this._storeName], 'readwrite');
            const store = transaction.objectStore(this._storeName);
            store.delete('firebase_user');
        } catch (e) {
            console.warn('IndexedDB clear failed:', e);
        }
        
        // Clear sessionStorage
        try {
            sessionStorage.removeItem('firebase_user');
        } catch (e) {
            // sessionStorage not available
        }
        
        // Trigger auth callback
        if (window._authCallback) window._authCallback(null);
        return Promise.resolve();
    },
    
    getCurrentUser: function() {
        return this.currentUser;
    },
    
    setDocument: async function(collection, docId, data) {
        if (!this.currentUser) {
            console.error('❌ setDocument failed: Not authenticated');
            throw new Error('Not authenticated');
        }
        await this.refreshTokenIfNeeded();
        
        const url = `https://firestore.googleapis.com/v1/projects/${this.config.projectId}/databases/(default)/documents/${collection}/${docId}`;
        const firestoreData = this.toFirestoreFormat(data);
        
        console.log('🔥 Firestore PATCH request:', {
            url,
            collection,
            docId,
            dataKeys: Object.keys(data)
        });
        
        const response = await fetch(url, {
            method: 'PATCH',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${this.currentUser.token}`
            },
            body: JSON.stringify({ fields: firestoreData })
        });
        
        const result = await response.json();
        console.log('🔥 Firestore response:', response.status, result);
        
        if (result.error) {
            console.error('❌ Firestore error:', result.error);
            throw new Error(result.error.message || JSON.stringify(result.error));
        }
        return result;
    },
    
    getDocument: async function(collection, docId) {
        if (!this.currentUser) throw new Error('Not authenticated');
        await this.refreshTokenIfNeeded();
        
        const url = `https://firestore.googleapis.com/v1/projects/${this.config.projectId}/databases/(default)/documents/${collection}/${docId}`;
        const response = await fetch(url, {
            headers: { 'Authorization': `Bearer ${this.currentUser.token}` }
        });
        
        const result = await response.json();
        if (result.error) {
            if (result.error.code === 404) return null;
            throw new Error(result.error.message);
        }
        return this.fromFirestoreFormat(result.fields);
    },
    
    toFirestoreFormat: function(obj) {
        const result = {};
        for (const [key, value] of Object.entries(obj)) {
            if (value === null) result[key] = { nullValue: null };
            else if (typeof value === 'string') result[key] = { stringValue: value };
            else if (typeof value === 'number') result[key] = { doubleValue: value };
            else if (typeof value === 'boolean') result[key] = { booleanValue: value };
            else if (Array.isArray(value)) {
                result[key] = {
                    arrayValue: value.length > 0 ? {
                        values: value.map(item => {
                            if (item === null) return { nullValue: null };
                            if (typeof item === 'object') return { mapValue: { fields: this.toFirestoreFormat(item) } };
                            if (typeof item === 'string') return { stringValue: item };
                            if (typeof item === 'number') return { doubleValue: item };
                            if (typeof item === 'boolean') return { booleanValue: item };
                            return { stringValue: String(item) };
                        })
                    } : {}
                };
            } else if (typeof value === 'object') result[key] = { mapValue: { fields: this.toFirestoreFormat(value) } };
            else result[key] = { stringValue: String(value) };
        }
        return result;
    },
    
    fromFirestoreFormat: function(fields) {
        if (!fields) return null;
        const result = {};
        for (const [key, value] of Object.entries(fields)) {
            if (value.stringValue !== undefined) result[key] = value.stringValue;
            else if (value.doubleValue !== undefined) result[key] = value.doubleValue;
            else if (value.integerValue !== undefined) result[key] = parseInt(value.integerValue);
            else if (value.booleanValue !== undefined) result[key] = value.booleanValue;
            else if (value.nullValue !== undefined) result[key] = null;
            else if (value.arrayValue) {
                result[key] = value.arrayValue.values ? value.arrayValue.values.map(item => {
                    if (item.mapValue) return this.fromFirestoreFormat(item.mapValue.fields);
                    if (item.stringValue !== undefined) return item.stringValue;
                    if (item.doubleValue !== undefined) return item.doubleValue;
                    if (item.booleanValue !== undefined) return item.booleanValue;
                    return item;
                }) : [];
            } else if (value.mapValue) result[key] = this.fromFirestoreFormat(value.mapValue.fields);
        }
        return result;
    },
    
    // Robust storage using IndexedDB (works everywhere, persists forever)
    _memoryStore: {},
    _dbName: 'MaMaisonDB',
    _storeName: 'auth',
    
    _getDB: async function() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(this._dbName, 1);
            request.onerror = () => reject(request.error);
            request.onsuccess = () => resolve(request.result);
            request.onupgradeneeded = (event) => {
                const db = event.target.result;
                if (!db.objectStoreNames.contains(this._storeName)) {
                    db.createObjectStore(this._storeName);
                }
            };
        });
    },
    
    storeUser: async function(user) {
        const userData = { ...user, timestamp: Date.now() };
        
        // Store in memory
        this._memoryStore.firebase_user = userData;
        
        // Store in IndexedDB for persistence
        try {
            const db = await this._getDB();
            const transaction = db.transaction([this._storeName], 'readwrite');
            const store = transaction.objectStore(this._storeName);
            store.put(userData, 'firebase_user');
        } catch (e) {
            console.warn('IndexedDB storage failed:', e);
            // Fallback to sessionStorage
            try {
                sessionStorage.setItem('firebase_user', JSON.stringify(userData));
            } catch (e2) {
                console.warn('sessionStorage also failed:', e2);
            }
        }
    },
    
    getStoredUser: async function() {
        // Try memory first (fastest)
        if (this._memoryStore.firebase_user) {
            const user = this._memoryStore.firebase_user;
            if (Date.now() - user.timestamp < 60 * 60 * 1000) {
                return user;
            }
        }
        
        // Try IndexedDB
        try {
            const db = await this._getDB();
            const transaction = db.transaction([this._storeName], 'readonly');
            const store = transaction.objectStore(this._storeName);
            const request = store.get('firebase_user');
            
            const user = await new Promise((resolve, reject) => {
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
            
            if (user && Date.now() - user.timestamp < 60 * 60 * 1000) {
                this._memoryStore.firebase_user = user;
                return user;
            }
        } catch (e) {
            console.warn('IndexedDB read failed:', e);
        }
        
        // Fallback to sessionStorage
        try {
            const stored = sessionStorage.getItem('firebase_user');
            if (stored) {
                const user = JSON.parse(stored);
                if (Date.now() - user.timestamp < 60 * 60 * 1000) {
                    this._memoryStore.firebase_user = user;
                    return user;
                }
            }
        } catch (e) {
            console.warn('sessionStorage read failed:', e);
        }
        
        return null;
    },
    
    refreshTokenIfNeeded: async function() {
        if (!this.currentUser) return;
        
        const stored = this._memoryStore.firebase_user;
        if (!stored || Date.now() - stored.timestamp < 50 * 60 * 1000) return;
        
        const url = `https://securetoken.googleapis.com/v1/token?key=${this.config.apiKey}`;
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ grant_type: 'refresh_token', refresh_token: this.currentUser.refreshToken })
        });
        const data = await response.json();
        if (data.error) {
            // ✅ CRITICAL FIX: Do NOT call signOut() here.
            // signOut() fires _authCallback(null) → wipes vocabulary/recordings from memory
            // → then syncToFirebase saves empty data to Firebase = DATA WIPE.
            // Instead, just throw so the operation fails silently. Data stays in memory.
            console.warn('⚠️ Token refresh failed. Keeping data in memory. User should re-login.', data.error.message);
            throw new Error('Session expired - please re-login manually');
        }
        this.currentUser.token = data.id_token;
        this.currentUser.refreshToken = data.refresh_token;
        await this.storeUser(this.currentUser);
    },

    // ── Firebase Storage REST API ──────────────────────────────────────────
    uploadAudio: async function(filePath, audioBlob) {
        if (!this.currentUser) throw new Error('Not authenticated');
        await this.refreshTokenIfNeeded();

        const bucket = this.config.storageBucket;
        const encodedPath = encodeURIComponent(filePath);
        const uploadUrl = `https://firebasestorage.googleapis.com/v0/b/${bucket}/o?uploadType=media&name=${encodedPath}`;

        const response = await fetch(uploadUrl, {
            method: 'POST',
            headers: {
                'Content-Type': audioBlob.type || 'audio/wav',
                'Authorization': `Bearer ${this.currentUser.token}`
            },
            body: audioBlob
        });

        if (!response.ok) {
            const errText = await response.text();
            throw new Error(`Firebase Storage upload failed (${response.status}): ${errText}`);
        }

        const result = await response.json();
        console.log('📦 Firebase Storage upload response:', JSON.stringify(result).substring(0, 300));
        if (result.error) throw new Error(result.error.message || JSON.stringify(result.error));

        // Firebase Storage REST returns the token in result.downloadTokens
        // Build authenticated download URL - token may be in downloadTokens or metadata
        const token = result.downloadTokens || (result.metadata && result.metadata.firebaseStorageDownloadTokens);
        let downloadUrl;
        if (token) {
            downloadUrl = `https://firebasestorage.googleapis.com/v0/b/${bucket}/o/${encodedPath}?alt=media&token=${token}`;
        } else {
            // Fallback: use the authenticated URL (requires auth to play back)
            downloadUrl = `https://firebasestorage.googleapis.com/v0/b/${bucket}/o/${encodedPath}?alt=media`;
        }
        console.log('✅ Audio uploaded to Firebase Storage:', downloadUrl);
        return downloadUrl;
    },

    deleteAudio: async function(filePath) {
        if (!this.currentUser) throw new Error('Not authenticated');
        await this.refreshTokenIfNeeded();

        const bucket = this.config.storageBucket;
        const encodedPath = encodeURIComponent(filePath);
        const url = `https://firebasestorage.googleapis.com/v0/b/${bucket}/o/${encodedPath}`;

        const response = await fetch(url, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${this.currentUser.token}` }
        });

        if (response.status !== 204 && response.status !== 200) {
            console.warn('⚠️ Could not delete audio from Storage:', response.status);
        } else {
            console.log('✅ Audio deleted from Firebase Storage:', filePath);
        }
    }
};

// Initialize Firebase REST - no status bar needed
console.log('✅ Firebase REST ready!');

const firebaseConfig = {
    apiKey: "AIzaSyBMb0vvGcCqEQREhUeNr6odUn0xPbSA96A",
    authDomain: "ma-maison-app-9ff93.firebaseapp.com",
    projectId: "ma-maison-app-9ff93",
    storageBucket: "ma-maison-app-9ff93.firebasestorage.app",
    messagingSenderId: "874510508050",
    appId: "1:874510508050:web:7ee47a413e49caba4238cb"
};

// Initialize Firebase (must be async now)
(async () => {
    try {
        console.log('🔄 Initializing Firebase REST...');
        await FirebaseREST.init(firebaseConfig);
        console.log('✅ Firebase initialized successfully');
        
        // Make compatible with existing code
        window.firebaseAuth = FirebaseREST;
        window.firebaseDB = FirebaseREST;
        window.firebaseReady = true;
        window.firebaseModules = {
            signInWithEmailAndPassword: (auth, email, password) => FirebaseREST.signIn(email, password),
            createUserWithEmailAndPassword: (auth, email, password) => FirebaseREST.signUp(email, password),
            signOut: (auth) => FirebaseREST.signOut(),
            onAuthStateChanged: async (auth, callback) => {
                // Check stored user on load (async) with error handling
                try {
                    const storedUser = await FirebaseREST.getStoredUser();
                    if (storedUser) {
                        FirebaseREST.currentUser = storedUser;
                        console.log('👤 Restored user from storage:', storedUser.email);
                        callback(storedUser);
                    } else {
                        console.log('👤 No stored user found');
                        callback(null);
                    }
                } catch (error) {
                    console.warn('⚠️ Error checking stored user:', error);
                    // ✅ CRITICAL FIX: Do NOT call callback(null) on error.
                    // callback(null) triggers loadFromLocalStorage() which empties all arrays,
                    // then syncToFirebase() can wipe Firebase with empty data.
                    // If we can't confirm the user, just do nothing — data stays safe.
                    console.warn('⚠️ Auth check failed silently. Data NOT wiped.');
                }
                
                // Listen for changes
                window._authCallback = callback;
            },
        doc: (db, collection, docId) => ({ collection, docId }),
        setDoc: (ref, data) => FirebaseREST.setDocument(ref.collection, ref.docId, data),
        getDoc: (ref) => FirebaseREST.getDocument(ref.collection, ref.docId).then(data => ({
            exists: () => data !== null,
            data: () => data
        }))
    };
    
    console.log('✅ Firebase modules configured');
    } catch (error) {
        console.error('❌ Firebase initialization failed:', error);
        alert('Firebase initialization failed. Check console for details.');
    }
    
    // ============================================
    // INDEXEDDB FOR AUDIO RECORDINGS
    // ============================================
    const AudioStorage = {
        dbName: 'MaMaisonAudio',
        storeName: 'recordings',
        db: null,
        
        async init() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(this.dbName, 1);
                
                request.onerror = () => reject(request.error);
                request.onsuccess = () => {
                    this.db = request.result;
                    console.log('✅ IndexedDB for audio initialized');
                    resolve(this.db);
                };
                
                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains(this.storeName)) {
                        db.createObjectStore(this.storeName, { keyPath: 'id' });
                        console.log('✅ IndexedDB object store created');
                    }
                };
            });
        },
        
        async saveRecording(id, audioBlob) {
            if (!this.db) await this.init();
            
            return new Promise((resolve, reject) => {
                const transaction = this.db.transaction([this.storeName], 'readwrite');
                const store = transaction.objectStore(this.storeName);
                const request = store.put({ id, audioBlob, timestamp: Date.now() });
                
                request.onsuccess = () => {
                    console.log('✅ Audio saved to IndexedDB:', id);
                    resolve();
                };
                request.onerror = () => reject(request.error);
            });
        },
        
        async getRecording(id) {
            if (!this.db) await this.init();
            
            return new Promise((resolve, reject) => {
                const transaction = this.db.transaction([this.storeName], 'readonly');
                const store = transaction.objectStore(this.storeName);
                const request = store.get(id);
                
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        },
        
        async deleteRecording(id) {
            if (!this.db) await this.init();
            
            return new Promise((resolve, reject) => {
                const transaction = this.db.transaction([this.storeName], 'readwrite');
                const store = transaction.objectStore(this.storeName);
                const request = store.delete(id);
                
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }
    };
    
    // ============================================
    // AUDIO COMPRESSION
    // ============================================
    async function compressAudio(audioBlob) {
        try {
            console.log('🔊 Original audio size:', (audioBlob.size / 1024 / 1024).toFixed(2), 'MB');
            
            // Create audio context
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const arrayBuffer = await audioBlob.arrayBuffer();
            const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
            
            // Create offline context with lower sample rate (compress!)
            const sampleRate = 22050; // Down from 48000 - saves ~50% space
            const offlineContext = new OfflineAudioContext(
                1, // mono instead of stereo - saves 50% space
                audioBuffer.duration * sampleRate,
                sampleRate
            );
            
            // Create buffer source
            const source = offlineContext.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(offlineContext.destination);
            source.start();
            
            // Render compressed audio
            const compressedBuffer = await offlineContext.startRendering();
            
            // Convert back to blob with lower bitrate
            const wav = audioBufferToWav(compressedBuffer);
            const compressedBlob = new Blob([wav], { type: 'audio/wav' });
            
            console.log('✅ Compressed audio size:', (compressedBlob.size / 1024 / 1024).toFixed(2), 'MB');
            console.log('📊 Compression ratio:', ((1 - compressedBlob.size / audioBlob.size) * 100).toFixed(1) + '% smaller');
            
            return compressedBlob;
        } catch (error) {
            console.warn('⚠️ Audio compression failed, using original:', error);
            return audioBlob;
        }
    }
    
    // Convert AudioBuffer to WAV format
    function audioBufferToWav(buffer) {
        const length = buffer.length * buffer.numberOfChannels * 2;
        const arrayBuffer = new ArrayBuffer(44 + length);
        const view = new DataView(arrayBuffer);
        const channels = [];
        let offset = 0;
        let pos = 0;
        
        // Write WAV header
        setUint32(0x46464952); // "RIFF"
        setUint32(36 + length); // file length
        setUint32(0x45564157); // "WAVE"
        setUint32(0x20746d66); // "fmt " chunk
        setUint32(16); // length = 16
        setUint16(1); // PCM
        setUint16(buffer.numberOfChannels);
        setUint32(buffer.sampleRate);
        setUint32(buffer.sampleRate * 2 * buffer.numberOfChannels); // byte rate
        setUint16(buffer.numberOfChannels * 2); // block align
        setUint16(16); // bits per sample
        setUint32(0x61746164); // "data" chunk
        setUint32(length);
        
        function setUint16(data) {
            view.setUint16(pos, data, true);
            pos += 2;
        }
        
        function setUint32(data) {
            view.setUint32(pos, data, true);
            pos += 4;
        }
        
        // Write interleaved data
        for (let i = 0; i < buffer.numberOfChannels; i++) {
            channels.push(buffer.getChannelData(i));
        }
        
        while (offset < buffer.length) {
            for (let i = 0; i < buffer.numberOfChannels; i++) {
                let sample = Math.max(-1, Math.min(1, channels[i][offset]));
                sample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
                view.setInt16(pos, sample, true);
                pos += 2;
            }
            offset++;
        }
        
        return arrayBuffer;
    }
    
    // Initialize AudioStorage on page load
    AudioStorage.init().catch(err => console.warn('IndexedDB init failed:', err));
    
    console.log('✅ Audio compression and IndexedDB ready!');
    
    // Call initFirebaseAuth when ready (outside try/catch so errors don't break Firebase)
    if (window.initFirebaseAuth) {
        try {
            window.initFirebaseAuth();
        } catch (e) {
            console.error('❌ initFirebaseAuth error:', e);
        }
    } else {
        const checkInit = setInterval(() => {
            if (window.initFirebaseAuth) {
                clearInterval(checkInit);
                try {
                    window.initFirebaseAuth();
                } catch (e) {
                    console.error('❌ initFirebaseAuth error:', e);
                }
            }
        }, 100);
    }
})(); // Close async IIFE
    </script>

        /* ====== SVG ANIMATIONS ====== */
        .animation-container {

        /* ====== HOUSE ICON STYLES ====== */

        /* === SRS SYSTEM STYLES === */
        .srs-stats-grid {

            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));

            margin-bottom: 2rem;

        .srs-progress-bar {

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Work Sans', sans-serif;
            background: var(--cream);
            color: var(--text);
            line-height: 1.7;
            font-weight: 300;
            overflow-x: hidden;
        }

        /* Affirmation */
        .affirmation {
            position: fixed;
            top: 20%;
            right: 3rem;
            max-width: 280px;
            padding: 1.5rem;
            background: var(--cream);
            border-left: 2px solid var(--gold);
            box-shadow: 0 4px 20px var(--shadow);
            opacity: 0;
            transform: translateX(20px);
            pointer-events: none;
            z-index: 1000;
            transition: all 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .affirmation.visible {
            opacity: 1;
            transform: translateX(0);
        }

        .affirmation-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            font-weight: 400;
            color: var(--navy);
            margin-bottom: 0.5rem;
            font-style: italic;
        }

        .affirmation-translation {
            font-size: 0.85rem;
            color: var(--text-soft);
        }

        /* Floating Heart Button - HIDDEN (not needed) */
        #floating-heart {
            display: none !important;
        }
        
        /* Animated floating hearts - DISABLED */
        .floating-heart:not(#floating-heart) {
            display: none;
        }

        /* Dark Mode Toggle Button */
        .dark-mode-toggle {
            position: fixed;
            bottom: 2rem;
            left: 2rem;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--cream);
            border: 1px solid var(--whisper);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px var(--shadow);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
        }

        body.dark-mode .dark-mode-toggle {
            background: var(--cream-dark);
            border-color: var(--whisper);
        }

        .dark-mode-toggle:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 24px var(--shadow-strong);
        }

        .dark-mode-toggle svg {
            width: 24px;
            height: 24px;
            transition: all 0.4s ease;
        }

        .dark-mode-toggle .sun-icon {
            display: none;
        }

        body.dark-mode .dark-mode-toggle .sun-icon {
            display: block;
        }

        body.dark-mode .dark-mode-toggle .moon-icon {
            display: none;
        }

        /* Celestial Body (Sun/Moon) - Atmospheric Feature */
        .celestial-body {
            position: absolute;
            top: -15px;
            right: -15px;
            width: 45px;
            height: 45px;
            z-index: 10;
            pointer-events: none;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Sun SVG */
        .celestial-body .sun {
            opacity: 1;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .celestial-body .moon {
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        /* Dark mode transitions */
        body.dark-mode .celestial-body .sun {
            opacity: 0;
            transform: rotate(180deg) scale(0.8);
        }

        body.dark-mode .celestial-body .moon {
            opacity: 1;
            transform: rotate(0deg) scale(1);
        }

        /* Glow effects */
        .celestial-body .sun {
            filter: drop-shadow(0 0 15px rgba(255, 200, 87, 0.7));
        }

        body.dark-mode .celestial-body .moon {
            filter: drop-shadow(0 0 12px rgba(232, 232, 232, 0.8));
        }

        /* Stars container */
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            transition: opacity 1s ease;
        }

        body.dark-mode .stars-container {
            opacity: 1;
        }

        /* Individual star */
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
            box-shadow: 0 0 3px rgba(255, 255, 255, 0.8);
        }

        /* Twinkling animation */
        @keyframes twinkle {
            0%, 100% {
                opacity: 0.3;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* Different animation delays for stars */
        .star:nth-child(2n) {
            animation-delay: 0.5s;
            animation-duration: 2.5s;
        }

        .star:nth-child(3n) {
            animation-delay: 1s;
            animation-duration: 3.5s;
        }

        .star:nth-child(4n) {
            animation-delay: 1.5s;
            animation-duration: 2.8s;
        }

        .star:nth-child(5n) {
            animation-delay: 0.8s;
            animation-duration: 3.2s;
        }

        /* Larger stars */
        .star.large {
            width: 3px;
            height: 3px;
            box-shadow: 0 0 5px rgba(255, 255, 255, 0.9);
        }

        /* Mobile responsiveness for celestial body */
        @media (max-width: 768px) {
            .celestial-body {
                width: 38px;
                height: 38px;
                top: -12px;
                right: -12px;
            }
        }

        @media (max-width: 480px) {
            .celestial-body {
                width: 35px;
                height: 35px;
                top: -10px;
                right: -10px;
            }
        }

        /* Floating Quick Actions */
        .floating-actions {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 10500; /* INCREASED - appears above listening player modal (9999) and word lookup modals (10001) */
        }

        .floating-btn-main {
            width: 70px;
            height: 70px;
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            filter: drop-shadow(0 4px 20px rgba(166, 66, 83, 0.4));
            outline: none !important;
        }
        
        .floating-btn-main:focus {
            outline: none !important;
        }
        
        /* REMOVED - No more square background or ::before pseudo-element */

        .floating-btn-main:hover {
            transform: scale(1.1);
            filter: drop-shadow(0 6px 28px rgba(166, 66, 83, 0.6));
        }

        .floating-btn-main svg {
            width: 50px;
            height: 50px;
            position: absolute;
            transition: all 0.3s ease;
        }

        .floating-btn-main .close-icon {
            opacity: 0;
            transform: rotate(-90deg);
            stroke: #A64253;
            width: 30px;
            height: 30px;
        }

        .floating-actions.active .floating-btn-main .plus-icon {
            opacity: 0;
            transform: rotate(90deg);
        }

        .floating-actions.active .floating-btn-main .close-icon {
            opacity: 1;
            transform: rotate(0);
        }

        .floating-menu {
            position: absolute;
            bottom: 70px;
            right: 0;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .floating-actions.active .floating-menu {
            opacity: 1;
            pointer-events: all;
            transform: translateY(0);
        }

        .floating-btn-action {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1.25rem;
            background: var(--cream);
            border: 1px solid var(--whisper);
            border-radius: 28px;
            cursor: pointer;
            box-shadow: 0 4px 16px var(--shadow);
            transition: all 0.3s ease;
            white-space: nowrap;
            font-family: 'Work Sans', sans-serif;
